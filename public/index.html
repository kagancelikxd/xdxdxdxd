<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Paneli</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:#fff;
    display:flex;
    justify-content:center;
    padding:30px;
}

.panel{
    width:700px;
    background:#1b1b1b;
    border-radius:12px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
}

input, textarea{
    width:100%;
    background:#2a2a2a;
    color:white;
    border:1px solid #444;
    border-radius:8px;
    padding:10px;
    outline:none;
}

textarea{
    height:150px;
    resize:vertical;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    cursor:pointer;
}

#start{
    background:#28a745;
}

#stop{
    background:#dc3545;
}

button:hover{
    opacity:.9;
}

#log{
    margin-top:20px;
    background:#0d0d0d;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    height:200px;
    overflow-y:auto;
    font-family:monospace;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="panel">

<h2>Bot Paneli</h2>

<label>Bot Token</label>
<input type="text" id="token" placeholder="Bot Token">

<label>Chat ID</label>
<input type="text" id="chatid" placeholder="-100xxxxxxxxxx">

<label>Mesajlar</label>
<textarea id="messages" placeholder="Her satıra bir mesaj yazabilirsiniz..."></textarea>

<label>Delay (ms)</label>
<input type="number" id="delay" value="3000">

<div class="buttons">
<button id="start">START</button>
<button id="stop">STOP</button>
</div>

<div id="log">Log ekranı hazır...</div>

</div>

<script>

const log=document.getElementById("log");

function addLog(text){
    log.innerHTML+="\n"+new Date().toLocaleTimeString()+" ➜ "+text;
    log.scrollTop=log.scrollHeight;
}

document.getElementById("start").onclick=function(){
    addLog("Bot başlatıldı.");
}

document.getElementById("stop").onclick=function(){
    addLog("Bot durduruldu.");
}

</script>

</body>
</html>
